<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Etiquetage magasin — Guide Rapide</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap');

:root {
  --bg: #0f1a0f;
  --surface: #1a2e1a;
  --surface2: #223322;
  --green: #4caf6e;
  --green-bright: #6ddc90;
  --red: #e05252;
  --yellow: #f0c040;
  --blue: #5b9bd5;
  --text: #e8f0e8;
  --muted: #8aab8a;
  --border: #2d4a2d;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Barlow', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 12px;
}

header {
  text-align: center;
  padding: 16px 0 20px;
  border-bottom: 2px solid var(--border);
  margin-bottom: 16px;
}

h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.4rem;
  color: var(--green-bright);
  letter-spacing: 3px;
  line-height: 1;
}

.subtitle {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* SEARCH */
.search-wrap {
  position: relative;
  margin-bottom: 16px;
}

#search {
  width: 100%;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px 12px 42px;
  font-size: 1rem;
  font-family: 'Barlow', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

#search:focus { border-color: var(--green); }
#search::placeholder { color: var(--muted); }

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 1.1rem;
  pointer-events: none;
}

/* TABS */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex-shrink: 0;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.tab.active {
  background: var(--green);
  border-color: var(--green);
  color: #0f1a0f;
}

/* PRODUCT LIST */
.product-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.product-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s;
}

.product-card:hover { border-color: var(--green); }

.product-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
}

.product-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.15rem;
  letter-spacing: 1.5px;
  color: var(--green-bright);
}

.product-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 2px;
}

.chip {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.chip-v { background: #1e3d2a; color: #6ddc90; }   /* variété */
.chip-c { background: #3d2e1e; color: #f0c040; }   /* couleur */
.chip-t { background: #3d1e1e; color: #e05252; }   /* traitement */
.chip-k { background: #1e2a3d; color: #5b9bd5; }   /* calibre */
.chip-cat { background: #2d1e3d; color: #c07aff; } /* catégorie */
.chip-igp { background: #3d3a1e; color: #e8c86e; } /* label */

.chevron {
  color: var(--muted);
  font-size: 0.9rem;
  transition: transform 0.2s;
  flex-shrink: 0;
  margin-left: 8px;
}

.product-card.open .chevron { transform: rotate(180deg); }

.product-body {
  display: none;
  padding: 0 14px 12px;
  border-top: 1px solid var(--border);
  margin-top: 0;
}

.product-card.open .product-body { display: block; }

.detail-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  align-items: flex-start;
}

.detail-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  min-width: 80px;
  padding-top: 1px;
}

.detail-value {
  font-size: 0.85rem;
  color: var(--text);
  flex: 1;
  line-height: 1.4;
}

.detail-value.highlight {
  color: var(--yellow);
  font-weight: 600;
}

.label-tag {
  display: inline-block;
  background: #3d3a1e;
  color: #e8c86e;
  border-radius: 5px;
  padding: 1px 7px;
  font-size: 0.75rem;
  font-weight: 600;
  margin: 2px 2px 0 0;
}

/* LEGEND */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  padding: 10px 12px;
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--border);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  color: var(--muted);
}

/* COUNT */
.count-bar {
  text-align: right;
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 8px;
}

#count { color: var(--green-bright); font-weight: 700; }

/* HIDDEN */
.hidden { display: none !important; }
</style>
</head>

// Build chips for a product
function buildChips(p) {
  let chips = '';
  if (p.variete) chips += '<span class="chip chip-v">V</span>';
  if (p.couleur) chips += '<span class="chip chip-c">C</span>';
  if (p.traitement) chips += '<span class="chip chip-t">T</span>';
  if (p.calibre) chips += '<span class="chip chip-k">K</span>';
  if (p.categorie) chips += '<span class="chip chip-cat">Cat</span>';
  if (p.labels && p.labels.length > 0) chips += '<span class="chip chip-igp">IGP</span>';
  return chips;
}

function renderProduct(p) {
  const chips = buildChips(p);
  let body = '';
  if (p.variete) body += `<div class="detail-row"><div class="detail-label">🌿 Variété</div><div class="detail-value highlight">${p.variete}</div></div>`;
  if (p.couleur) body += `<div class="detail-row"><div class="detail-label">🎨 Couleur</div><div class="detail-value highlight">${p.couleur}</div></div>`;
  if (p.traitement) body += `<div class="detail-row"><div class="detail-label">⚠️ Traitement</div><div class="detail-value" style="color:var(--red);font-weight:600">${p.traitement}</div></div>`;
  if (p.calibre) body += `<div class="detail-row"><div class="detail-label">📏 Calibre</div><div class="detail-value">${p.calibre}</div></div>`;
  if (p.categorie) body += `<div class="detail-row"><div class="detail-label">🏷 Catégorie</div><div class="detail-value">${p.categorie}</div></div>`;
  if (p.notes) body += `<div class="detail-row"><div class="detail-label">📝 Note</div><div class="detail-value" style="color:var(--yellow)">${p.notes}</div></div>`;
  if (p.labels && p.labels.length > 0) {
    const lbls = p.labels.map(l => `<span class="label-tag">${l}</span>`).join('');
    body += `<div class="detail-row"><div class="detail-label">🥇 Labels</div><div class="detail-value">${lbls}</div></div>`;
  }

  return `
    <div class="product-card" data-cat="${p.cat}" data-name="${p.name.toLowerCase()}">
      <div class="product-header" onclick="toggle(this)">
        <div>
          <div class="product-name">${p.name}</div>
          <div class="product-tags">${chips || '<span style="font-size:0.75rem;color:var(--muted)">Origine + Prix uniquement</span>'}</div>
        </div>
        <span class="chevron">▼</span>
      </div>
      <div class="product-body">${body || '<div style="color:var(--muted);font-size:0.85rem;padding-top:4px">✅ Origine + Prix obligatoires — rien d\'autre requis.</div>'}</div>
    </div>
  `;
}

const list = document.getElementById('list');
const countEl = document.getElementById('count');

function renderAll(filter = 'all', query = '') {
  const q = query.trim().toLowerCase();
  let html = '';
  let count = 0;
  products.forEach(p => {
    const matchFilter = filter === 'all' || p.cat === filter || (filter === 'label' && p.labels && p.labels.length > 0);
    const matchQuery = !q || p.name.toLowerCase().includes(q);
    if (matchFilter && matchQuery) {
      html += renderProduct(p);
      count++;
    }
  });
  list.innerHTML = html || '<div style="text-align:center;color:var(--muted);padding:32px">Aucun produit trouvé</div>';
  countEl.textContent = count;
}

function toggle(header) {
  const card = header.closest('.product-card');
  card.classList.toggle('open');
}

let currentFilter = 'all';
let currentQuery = '';

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderAll(currentFilter, currentQuery);
  });
});

document.getElementById('search').addEventListener('input', e => {
  currentQuery = e.target.value;
  renderAll(currentFilter, currentQuery);
});

// Initial render
renderAll();
</script>
